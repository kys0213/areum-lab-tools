[workspace]
resolver = "3"
members = ["tools/*"]

[workspace.package]
edition = "2024"
rust-version = "1.96"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
bytes = "1"
mime_guess = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
# Gateway websocket only: default features pull in twilight-http (we reuse our
# own reqwest client for REST) and zstd (a C dependency), so both are dropped
# via default-features=false. rustls-webpki-roots mirrors reqwest's rustls-tls
# (bundled roots, no platform-native verifier dep).
twilight-gateway = { version = "0.17", default-features = false, features = ["rustls-webpki-roots"] }
twilight-model = "0.17"
# HTTP + WebSocket server for the doppel daemon, served on a Unix socket and a
# loopback TCP port from one router.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
# Client side of the doppel daemon's Unix socket: plain HTTP/1 requests (hyper)
# and the attach WebSocket (tokio-tungstenite).
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Unix process signalling (kill(2) liveness probe + SIGTERM) for daemon stop/status.
libc = "0.2"

[profile.release]
strip = true
