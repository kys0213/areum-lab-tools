name: Release

# 도구별 독립 릴리스. 태그 형식: `<tool>-vX.Y.Z` (예: discord-v0.1.0).
# version은 항상 태그의 "마지막" "-v" 뒤 문자열이다 — 도구 이름 자체에 "-v"가
# 들어 있어도(예: `my-v-tool-v1.0.0`) 안전하게 분리된다.
# tools/<tool>/Cargo.toml의 version 리터럴과 태그 버전이 다르면 fail-fast.
# 빌드 target은 도구별로 tools/<tool>/release-targets 에 선언한다 (없으면
# aarch64-apple-darwin). plan job이 scripts/release_targets.sh 로 matrix를
# 만들고, build job이 target마다 tarball을 만든다.
# 체크섬 계약: 각 tarball과 같은 디렉토리에 "<tarball명>.sha256"을 생성한다.
# 내용은 `shasum -a 256 <tarball>` 출력 형식(해시 + 공백 두 칸 + tarball
# 베이스네임, 경로 없음) — 설치 스크립트가 `shasum -a 256 -c`로 검증한다.
on:
  push:
    tags: ['*-v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: "Tool tag to build (e.g. hello-v0.0.0)"
        required: true

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tool: ${{ steps.parse.outputs.tool }}
      version: ${{ steps.parse.outputs.version }}
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse tag into tool + version
        id: parse
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          # version은 마지막 "-v" 뒤 (도구 이름에 "-v"가 포함될 수 있으므로 %-v*/##*-v 사용).
          TOOL="${TAG%-v*}"
          VERSION="${TAG##*-v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "tool=$TOOL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate tag version matches Cargo.toml (fail-fast)
        run: |
          TOOL="${{ steps.parse.outputs.tool }}"
          VERSION="${{ steps.parse.outputs.version }}"
          MANIFEST="tools/$TOOL/Cargo.toml"

          if [ ! -d "tools/$TOOL" ]; then
            echo "::error::tools/$TOOL does not exist (parsed tool from tag ${{ steps.parse.outputs.tag }})"
            exit 1
          fi

          MANIFEST_VERSION="$(grep -m1 '^version = ' "$MANIFEST" | sed -E 's/version = "(.*)"/\1/')"

          if [ "$MANIFEST_VERSION" != "$VERSION" ]; then
            echo "::error::tag version ($VERSION) does not match $MANIFEST version ($MANIFEST_VERSION)"
            exit 1
          fi

      - name: Resolve release targets
        id: targets
        run: echo "matrix=$(./scripts/release_targets.sh "${{ steps.parse.outputs.tool }}")" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      # toolchain 버전/components는 rust-toolchain.toml이 SSOT이므로 여기서
      # 재기재하지 않는다. 별도 Swatinem 캐시 스텝도 추가하지 않는다.
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      # 러너의 기본 target 이 아닌 target(Apple Silicon 러너의 x86_64-apple-darwin)
      # 은 std 를 따로 받아야 한다. 이미 있으면 no-op 이다.
      - name: Add build target
        run: rustup target add ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release -p ${{ needs.plan.outputs.tool }} --target ${{ matrix.target }}

      - name: Package tar.gz
        run: |
          TOOL="${{ needs.plan.outputs.tool }}"
          VERSION="${{ needs.plan.outputs.version }}"
          TARBALL="$TOOL-$VERSION-${{ matrix.target }}.tar.gz"
          tar czf "$TARBALL" \
            -C "target/${{ matrix.target }}/release" "$TOOL"
          # cwd가 repo root이고 $TARBALL이 베이스네임뿐이라 체크섬 파일의
          # 파일명 필드에도 경로가 섞이지 않는다.
          shasum -a 256 "$TARBALL" > "$TARBALL.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ needs.plan.outputs.tool }}-${{ needs.plan.outputs.version }}-${{ matrix.target }}.tar.gz
            ${{ needs.plan.outputs.tool }}-${{ needs.plan.outputs.version }}-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  # target 마다 Release 에 따로 올리면 병렬 job 들이 Release 생성을 두고 경쟁한다.
  # 모든 target 이 빌드된 뒤 한 번에 첨부한다.
  publish:
    needs: [plan, build]
    # workflow_dispatch는 빌드 검증용이므로 실제 태그 push일 때만 Release에 첨부.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
